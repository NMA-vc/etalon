[package]
name = "etalon-cli"
version = "0.9.1"
edition = "2024"
description = "Lightning-fast privacy compliance and tracking detection CLI"
license = "MIT"
repository = "https://github.com/NMA-vc/etalon"

[dependencies]
anyhow.workspace = true
chromiumoxide = "0.9.1"
chrono = "0.4.44"
clap = { version = "4.5.60", features = ["derive"] }
etalon-core = { version = "0.9.1", path = "../core" }
etalon-techscan = { version = "0.9.1", path = "../techscan" }
futures = "0.3.32"
futures-util = "0.3.32"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros"] }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = "0.3.22"
walkdir = "2.5.0"
