[package]
name = "etalon-techscan"
version = "0.9.5"
edition = "2024"
description = "Blazing fast asynchronous technology fingerprinting engine"
license = "MIT"
repository = "https://github.com/NMA-vc/etalon"

[dependencies]
aho-corasick = "1.1.4"
anyhow.workspace = true
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
hickory-resolver = { version = "0.24.1", features = ["system-config", "tokio"] }
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["gzip", "cookies", "default-tls", "stream"] }
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "macros"] }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
