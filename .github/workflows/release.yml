name: Release

on:
  release:
    types: [created]

jobs:
  # ── Publish crates to crates.io ──────────────────────────
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ad397744b0d591a723ab90405b7247fac0e6b8db

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f87935cf1fdb7ef4e5cf4595fa6f1e164629e469

      # Publish in dependency order with delay for index propagation
      - name: Publish etalon-core
        run: cargo publish -p etalon-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish etalon-techscan
        run: cargo publish -p etalon-techscan --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish etalon-cli
        run: cargo publish -p etalon-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish etalon-mcp-server
        run: cargo publish -p etalon-mcp-server --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Build & upload platform binaries ─────────────────────
  build-and-upload:
    name: Build & Upload to Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: etalon-linux-amd64
          - build: macos
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: etalon-macos-arm64
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: etalon-windows-amd64.exe

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ad397744b0d591a723ab90405b7247fac0e6b8db
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f87935cf1fdb7ef4e5cf4595fa6f1e164629e469

      - name: Build etalon-cli
        run: cargo build --release -p etalon-cli --target ${{ matrix.target }}

      - name: Build etalon-mcp-server
        run: cargo build --release -p etalon-mcp-server --target ${{ matrix.target }}

      # Upload CLI
      - name: Upload etalon-cli Release Asset
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: target/${{ matrix.target }}/release/etalon-cli${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          name: etalon-cli-${{ matrix.artifact_name }}

      # Upload MCP Server
      - name: Upload etalon-mcp-server Release Asset
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: target/${{ matrix.target }}/release/etalon-mcp-server${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          name: etalon-mcp-server-${{ matrix.artifact_name }}

  # ── Docker image ─────────────────────────────────────────
  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
