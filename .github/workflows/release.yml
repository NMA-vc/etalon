name: Release

on:
  release:
    types: [created]

jobs:
  # ── Publish crates to crates.io ──────────────────────────
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Publish in dependency order with delay for index propagation
      - name: Publish etalon-core
        run: cargo publish -p etalon-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish etalon-techscan
        run: cargo publish -p etalon-techscan
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish etalon-cli
        run: cargo publish -p etalon-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish etalon-mcp-server
        run: cargo publish -p etalon-mcp-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Build & upload platform binaries ─────────────────────
  build-and-upload:
    name: Build & Upload to Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: etalon-linux-amd64
          - build: macos
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: etalon-macos-arm64
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: etalon-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build etalon-cli
        run: cargo build --release -p etalon-cli --target ${{ matrix.target }}

      - name: Build etalon-mcp-server
        run: cargo build --release -p etalon-mcp-server --target ${{ matrix.target }}

      # Upload CLI
      - name: Upload etalon-cli Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/etalon-cli${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          name: etalon-cli-${{ matrix.artifact_name }}

      # Upload MCP Server
      - name: Upload etalon-mcp-server Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/etalon-mcp-server${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          name: etalon-mcp-server-${{ matrix.artifact_name }}

  # ── Docker image ─────────────────────────────────────────
  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Publish to NPM ───────────────────────────────────────
  publish-npm:
    name: Publish Wrapper to NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
